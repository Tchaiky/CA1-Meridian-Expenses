name: Security pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read
  pull_requests: read            # least privilege: the jobs only need to read the code

jobs:
  # ----------------------------------------------------------- SAST -------
  bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install bandit
      # Full report kept as an artifact, whatever the result
      - name: Generate Bandit report
        run: bandit -r . -x ./tests,./.venv,./venv -f json -o bandit-results.json || true
      # The gate: fail on MEDIUM severity and above (-ll)
      - run: bandit -r . -x ./tests,./.venv,./venv -ll
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-results
          path: bandit-results.json

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6

      - name: Scan Python and Flask code
        run: semgrep scan --config p/python --config p/flask --error --metrics=off --exclude tests .

  # ------------------------------------------------------------ SCA -------
  pip-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pip-audit

      - name: Check dependencies
        run: pip-audit -r requirements.txt --desc

  # ------------------------------------------------------- Secrets -------
  gitleaks:
    name: Gitleaks (Secret Detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository for exposed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  # ------------------------------------------------------- Quality -------
  ruff:
    name: Ruff (Code Quality)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install ruff

      - name: Check Python code
        run: ruff check . --select E,F,W --ignore E501

  tests:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run automated security tests
        run: python -m pytest tests/ -v

  # ---------------------------------------------------- Build (gated) -----
  # needs: is the quality gate. If any check above fails, this never runs.
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: [bandit, semgrep, pip-audit, gitleaks, ruff, tests]
    steps:
      - uses: actions/checkout@v6
      - name: Package the release
        run: |
          VERSION="$(date +%Y.%m.%d).${GITHUB_SHA::7}"
          echo "Packaging Meridian Expenses $VERSION"
          mkdir -p dist
          tar --exclude=./dist --exclude=./.git -czf "dist/meridian-expenses-$VERSION.tar.gz" .
          ls -lh dist
      - uses: actions/upload-artifact@v7
        with:
          name: meridian-expenses-release
          path: dist/

  # ----------------------------------------------------------- DAST -------
  # SAST reads the code. DAST attacks the running app, so it sees what
  # only exists at runtime, such as missing security headers.
  dast:
    name: DAST (ZAP baseline)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install application dependencies and prepare database
        run: |
          pip install -r requirements.txt
          python seed.py

      - name: Start the app on the runner
        run: |
          nohup python -m flask --app app run --host 127.0.0.1 --port 5000 > flask.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:5000/ && exit 0; sleep 1; done
          cat flask.log; exit 1

      - name:  OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:5000
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline-report
